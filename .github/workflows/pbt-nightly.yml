name: PBT nightly

on:
  schedule:
    - cron: "0 3 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  pbt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@master
      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.14
        with:
          architecture: x64
          distribution: "full"
          variant: "CS"
          version: "stable"
      - run: raco pkg install --auto
      - run: raco test tests/pbt-build-cache.rkt
        env:
          TR_PBT_TESTS: "500"
